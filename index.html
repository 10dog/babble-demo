const { html, render, Component: Base } = htmPreact;

const LINE = [['dry','Dry'],['underwater','Underwater'],['radio','Radio'],['cave','Cave'],['echo','Echo']];
const WAVES = [['syllable','Syllables'],['triangle','Triangle'],['square','Square'],['sawtooth','Saw'],['sine','Sine'],['noise','Noise']];

  chirpy: { personality:'excited', size:0.7, consonant:0.3 },

const EXAMPLES = [
  '[#whisper] Keep your voice down.',
  '[#shout] Get out of the water!',
  'Wait...[wait=0.8] did you hear that?',
  '[speed=0.5]Slowly now,[speed=2] then very fast!',
  '[#mood=nervous] Is it safe? Are you sure?',
  '[#mood=grumpy] I told you this would happen.',
  'Gruff: [[Hmph|Fine|Whatever]], [b]captain[/b].'

const FORMANTS = { A:[800,1200], E:[400,2200], O:[450,800], M:[300,900], C:[500,1500] };
const voice = (id, name, tag, wave, rules, fx, line, art) => ({ id, name, tag, wave, fx, line, art, rules: Object.assign({ pitch:1, speed:18, pitch_range:6, vowel_lift:2, question_rise:4, jitter:1, blip_every:2, space_pause:0.04, comma_pause:0.18, stop_pause:0.32 }, rules) });

const START = () => [
  voice('chirpy','Chirpy','Bird, bright','triangle',{ pitch:1.7, speed:20, pitch_range:9, vowel_lift:4, question_rise:5 },Object.assign({},none),'dry',{ bg:C.teal, body:C.sun, parts:[[4,4,8,10,C.sun],[3,5,10,8,C.sun],[7,2,2,2,C.gold]], eyes:[[5,7,2,2],[9,7,2,2]] }),
  voice('gruff','Gruff','Bear, low','sawtooth',{ pitch:0.6, speed:13, pitch_range:4, vowel_lift:1, question_rise:2 },Object.assign({},none,{ drive:0.6 }),'dry',{ bg:C.lift, body:C.red, parts:[[2,3,3,3,C.red],[11,3,3,3,C.red],[3,5,10,9,C.red]], eyes:[[5,7,2,1],[9,7,2,1]] }),
  voice('robot','Robot','Vowel talkbox','sawtooth',{ pitch:0.9, speed:15, pitch_range:2, vowel_lift:0, jitter:0, blip_every:1, question_rise:3 },Object.assign({},none,{ formant:0.8, ring:0.25 }),'dry',{ bg:C.dark, body:C.shine, parts:[[7,1,2,2,C.gold],[7,3,2,1,C.lift],[3,4,10,10,C.shine],[1,7,2,3,C.lift],[13,7,2,3,C.lift]], eyes:[[4,6,3,3],[9,6,3,3]], eye:C.aqua }),
  voice('floppy','Floppy','Dog, loose','sine',{ pitch:1.1, speed:18, pitch_range:14, vowel_lift:6, jitter:3, blip_every:3 },Object.assign({},none,{ comb:0.4 }),'dry',{ bg:C.gold, body:C.white, parts:[[4,3,8,11,C.white],[2,4,2,7,C.lift],[12,4,2,7,C.lift]], eyes:[[5,6,2,2],[9,6,2,2]] }),
  voice('bubbles','Bubbles','Fish, underwater','triangle',{ pitch:1.3, speed:14, pitch_range:8, vowel_lift:3, jitter:2 },Object.assign({},none,{ comb:0.25 }),'underwater',{ bg:C.dark, body:C.teal, parts:[[3,4,10,10,C.teal],[2,6,12,6,C.teal],[0,7,2,3,C.aqua],[14,7,2,3,C.aqua],[7,2,2,2,C.aqua]], eyes:[[4,6,2,3],[10,6,2,3]], eye:C.white })

const MOUTH = { rest:[[6,11,4,1]], M:[[5,11,6,1]], C:[[6,10,4,2]], E:[[5,10,6,2]], O:[[6,10,4,3]], A:[[5,10,6,3]] };
const SCENE = [
  ['robot', 'Hello! Are you sure about this, captain?'],
  ['bubbles', '[#whisper] Blub. The water is rising.'],
  ['gruff', 'Then we swim.'],
  ['chirpy', '[#shout] Swim?[wait=0.4] I am a bird!'],
  ['floppy', 'I will fetch a boat!'],
  ['robot', 'Boat not found.']

const REPLIES = { chirpy: 'Ooh! Tell me more!', gruff: 'Hmph. Fine.', robot: 'Input received.', floppy: 'Yes! Yes! Again!', bubbles: 'Blub blub?' };
const GD = /(#.*)|("(?:[^"\\]|\\.)*")|\b(var|func|await|if|return)\b|\b([A-Z]\w*)\b|\b(\w+)(?=\()|\b(\d+(?:\.\d+)?)\b/g;

const tokens = (text, re, classify) => {
  const out = [];
  let last = 0;
  text.replace(re, function (match) {
    const at = arguments[arguments.length - 2];
    if (at > last) out.push({ t: text.slice(last, at), cls: '' });
    out.push({ t: match, cls: classify(arguments) });
    last = at + match.length;
    return match;
  });
  if (last < text.length) out.push({ t: text.slice(last), cls: '' });
  return out;

const gdTokens = (text) => tokens(text, GD, (m) => m[1] ? 'k-com' : m[2] ? 'k-str' : m[3] ? 'k-key' : m[4] ? 'k-type' : m[5] ? 'k-fn' : 'k-num');
const jsonTokens = (text) => tokens(text, JS, (m) => m[1] ? (m[2] ? 'k-prop' : 'k-str') : 'k-num');
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerpExp = (a, b, t) => a * Math.pow(b / a, t);
const rect = (r) => 'M' + r[0] + ' ' + r[1] + 'h' + r[2] + 'v' + r[3] + 'h-' + r[2] + 'z';

function layers(art, shape, blink) {
  const out = [{ fill: art.bg, d: 'M1 0h14v1h1v14h-1v1h-14v-1h-1v-14h1z' }];
  art.parts.forEach((p) => out.push({ fill: p[4], d: rect(p) }));
  const eyes = art.eyes.map((e) => blink ? [e[0], e[1] + e[3] - 1, e[2], 1] : e);
  out.push({ fill: art.eye || C.ink, d: eyes.map(rect).join('') });
  out.push({ fill: C.ink, d: MOUTH[shape].map(rect).join('') });
  if (shape === 'A') out.push({ fill: C.red, d: rect([6, 12, 4, 1]) });
  return out;
}

function shapeOf(c) {
  if ('a'.includes(c)) return 'A';
  if ('eiy'.includes(c)) return 'E';
  if ('ou'.includes(c)) return 'O';
  if ('mbpf'.includes(c)) return 'M';
  return 'C';
}

function hash(text) {
  let h = 2166136261;
  for (let i = 0; i < text.length; i++) h = Math.imul(h ^ text.charCodeAt(i), 16777619);
  return h >>> 0;
}

function rng(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function questionLetters(text) {
  const rise = {};
  let i = text.indexOf('?');
  while (i >= 0) {
    let start = i - 1;
    while (start >= 0 && ' ?'.includes(text[start])) start--;
    const end = start;
    while (start > 0 && text[start - 1] !== ' ') start--;
    for (let j = start; j <= end; j++) rise[j] = (j - start + 1) / (end - start + 1);
    i = text.indexOf('?', i + 1);
  }
  return rise;
}

// The same line text a .dialogue file holds, reduced to what Babble needs.
function parseLine(raw) {
  const out = { character: '', tags: [], waits: {}, speeds: {}, text: '' };
  let s = raw.replace(/\[\[(.*?)\]\]/g, (m, list) => { const o = list.split('|'); return o[hash(raw) % o.length]; });
  s = s.replace(/\{\{.*?\}\}/g, 'friend');
  const who = s.match(/^([^\s:\[][^:\[]{0,23}):\s*/);
  if (who) { out.character = who[1]; s = s.slice(who[0].length); }
  let last = 0;
  const add = (part) => { out.text += out.text ? part : part.replace(/^\s+/, ''); };
  s.replace(/\[(?:[^\[\]]|\[[^\]]*\])*\]/g, (m, at) => {
    add(s.slice(last, at));
    last = at + m.length;
    const body = m.slice(1, -1).trim(), number = parseFloat(body.split('=')[1]);
    if (body[0] === '#') body.split(',').forEach((t) => out.tags.push(t.trim().replace(/^#/, '')));
    else if (/^wait\b/.test(body)) out.waits[out.text.length] = (out.waits[out.text.length] || 0) + (isNaN(number) ? 0.5 : number);
    else if (/^speed=/.test(body) && number > 0) out.speeds[out.text.length] = number;
    return m;
  });
  add(s.slice(last));
  return out;
}

function lineStyle(line) {
  const style = { whisper: false, shout: false, personality: '' };
  line.tags.forEach((t) => {
    const name = t.replace(/^mood=/, '');
    if (t === 'whisper' || t === 'shout') style[t] = true;
    else if (PERSONALITY[name]) style.personality = name;
  });
  return style;
}

function sing(v, letters) {
  const lift = 12 * Math.log2(v.rules.pitch / v.size);
  let last = -GRID;
  letters.forEach((e) => {
    e.t = Math.max(Math.round(e.t / GRID) * GRID, e.blip ? last + GRID : last);
    if (e.blip) {
      const total = lift + e.st * 0.4 + TUNE_PHRASE[Math.floor(e.t / (GRID * 2)) % TUNE_PHRASE.length], octave = Math.floor(total / 12) * 12;
      const note = SCALE.concat([12]).reduce((a, b) => Math.abs(octave + b - total) < Math.abs(octave + a - total) ? b : a);
      e.st = octave + note - lift;
      e.extra = null;
      last = e.t;

    if ('.!?'.includes(text[i])) end = i;

    const c = text[i], low = c.toLowerCase();

      snippet: gdTokens('# With Dialogue Manager: Babble follows the label\nbabble.cast = {"' + v.name + '": BabbleVoice.load("res://voices/' + v.id + '.json")}\nbabble.follow(balloon.dialogue_label)\nbabble.mouth.connect(portrait.set_mouth)\n\n# Without it: Babble keeps its own time\nvar voice = babble.cast["' + v.name + '"]\nbabble.say("' + timeline.text.replace(/"/g, '\\"').slice(0, 28) + '", voice)\nawait babble.finished'),
      json: jsonTokens(JSON.stringify(file, null, 2)),
      path: 'res://voices/' + v.id + '.json',
      count: timeline.letters.length,
      seconds: timeline.duration.toFixed(2) + 's',
      mode: s.speaking ? 'Speaking' : 'Ready'
    };
  }
}


const Face = ({ layers }) => html`<svg class="px" viewBox="0 0 16 16" aria-hidden="true">${layers.map((l) => html`<path fill=${l.fill} d=${l.d} />`)}</svg>`;
const Code = ({ parts }) => html`<pre>${parts.map((k) => html`<span class=${k.cls}>${k.t}</span>`)}</pre>`;
const Pill = (x) => html`<button type="button" class=${'btn ' + x.cls} aria-pressed=${x.on} onClick=${x.pick}>${x.label}</button>`;

class App extends Component {
  render() {
    const r = this.renderVals();
    return html`<div class=${'app dir-' + r.dir}>
      <div class="top">
        <span class="brand">BABBLE</span>
        ${r.dirs.map(Pill)}
        <span class="spacer"></span>
        <button type="button" class="btn" onClick=${r.randomise}>Random</button>
        <button type="button" class="btn" onClick=${r.undo}>Undo</button>
      </div>
      <div class="work">
        <section class="panel lib" aria-label="Cast">
          <div class="head">CAST</div>
          <div class="body"><div class="voices">
            ${r.cast.map((v) => html`<button type="button" class=${'voice ' + v.cls} aria-pressed=${v.on} onClick=${v.pick}>
              <${Face} layers=${v.layers} />
              <span><b>${v.name}</b><small>${v.tag}</small></span>
            </button>`)}
          </div></div>
        </section>
        <section class="panel stage" aria-label="Stage">
          <div class="head">STAGE<span class="spacer"></span>
            ${r.stages.map((d) => html`<button type="button" class=${'btn mini ' + d.cls} aria-pressed=${d.on} onClick=${d.pick}>${d.label}</button>`)}
          </div>
          ${r.solo ? html`<div class="body solo">
            <svg class="px" viewBox="0 0 16 16" role="img" aria-label=${r.name}>${r.face.map((l) => html`<path fill=${l.fill} d=${l.d} />`)}</svg>
            <div class="who">${r.name}</div>
            <div class=${'bubble ' + r.soloLive}>${r.soloShown}<span class="ghost">${r.soloGhost}</span></div>
          </div>` : null}
          ${r.chatMode ? html`<div class="body chat">
            ${r.rows.map((m) => html`<div class=${'msg ' + m.cls}>
              <${Face} layers=${m.layers} />
              <div style="min-width:0">
                <div class="who">${m.name}</div>
                <div class=${'bubble ' + m.live}>
                  ${m.typing ? html`<div class="dots" role="img" aria-label=${m.name + ' is typing'}><i></i><i></i><i></i></div>` : null}
                  ${m.talking ? html`${m.shown}<span class="ghost">${m.unshown}</span>` : null}
                </div>
              </div>
            </div>`)}
            ${r.empty ? html`<p class="empty">Press Chat to play a scene, or type a line and press Say.</p>` : null}
          </div>` : null}
          <div class="event">${r.event}</div>
          <div class="say">
            <input type="text" aria-label="Test line" value=${r.line} onInput=${r.setLine} />
            <button type="button" class="btn go" onClick=${r.say}>Say</button>
            ${r.chatMode ? html`<button type="button" class="btn go" onClick=${r.chat}>Chat</button>` : null}
            <button type="button" class="btn" onClick=${r.skip}>Skip</button>
            <button type="button" class="btn" onClick=${r.stop}>Stop</button>
          </div>
        </section>
        <section class="panel time" aria-label="Line timeline">
          <div class="head">TIMELINE<span style="color:#819796">letters / pitch / mouth</span><span class="style">${r.lineStyle}</span></div>
          <div class="body"><div class="lanes">
            ${r.letters.map((l) => html`<div class=${'col ' + l.cls}>
              <div class="char">${l.c}</div>
              <div class="pitch">${l.blip ? html`<div class="dot" style=${'top:' + l.y + '%'}></div>` : null}</div>
              <div class="shape">${l.shape}</div>
            </div>`)}
          </div></div>
        </section>
        <section class="panel insp" aria-label="Inspector">
          <div class="tabs">${r.tabs.map((t) => html`<button type="button" class=${'tab ' + t.cls} aria-pressed=${t.on} onClick=${t.pick}>${t.label}</button>`)}</div>
          <div class="body">
            ${r.tabSound ? html`
              <div class="sect"><h3>BLIP SOURCE</h3><div class="pills">${r.waves.map(Pill)}</div>
                <p class="note">${r.sourceNote}</p></div>
              <div class="sect"><h3>PERSONALITY</h3><div class="pills">${r.personalities.map(Pill)}</div><p class="note">${r.personalityNote}</p></div>
              <div class="sect"><h3>BODY</h3>
                <label class="row"><span>Size</span><input type="range" min="0.5" max="2" step="0.01" value=${r.size} onInput=${r.setSize} /><b>${r.sizeShow}</b></label>
                <label class="row"><span>Consonants</span><input type="range" min="0" max="1" step="0.01" value=${r.consonant} onInput=${r.setConsonant} /><b>${r.consonantShow}</b></label>
                <div class="pills" style="margin-top:6px"><button type="button" class=${'btn ' + r.singCls} aria-pressed=${r.singOn} onClick=${r.toggleSing}>Sing to the beat</button></div></div>
              <div class="sect"><h3>BLIP FX</h3>
                ${r.fx.map((f) => html`<div class="fx">${Pill(f)}<input type="range" aria-label=${f.label + ' amount'} min="0" max="1" step="0.01" value=${f.amount} onInput=${f.set} /></div>`)}</div>
              <div class="sect"><h3>LINE FX (LIVE)</h3><div class="pills">${r.lineFx.map(Pill)}</div>
                <label class="row" style="margin-top:6px"><span>Amount</span><input type="range" min="0" max="1" step="0.01" value=${r.depth} onInput=${r.setDepth} /><b>${r.depthShow}</b></label>
                <p class="note">Drag Amount while a line is speaking.</p></div>
            ` : null}
            ${r.tabRules ? r.rules.map((x) => html`<label class="row"><span>${x.label}</span><input type="range" min=${x.min} max=${x.max} step=${x.step} value=${x.value} onInput=${x.set} /><b>${x.show}</b></label>`) : null}
            ${r.tabDialogue ? html`
              <div class="sect"><h3>TRY A LINE</h3>${r.examples.map((x) => html`<button type="button" class="ex" onClick=${x.pick}>${x.text}</button>`)}
                <p class="note">Same text as a .dialogue file. Type your own in the box under the stage.</p></div>
              <div class="sect"><h3>BABBLE ADDS</h3><${Code} parts=${r.tagHelp} /></div>
              <div class="sect"><h3>DIALOGUE MANAGER DOES</h3><${Code} parts=${r.dmHelp} /></div>
            ` : null}
            ${r.tabApi ? html`
              <div class="sect"><h3>USE IT (PROPOSED)</h3><${Code} parts=${r.snippet} /></div>
              <div class="sect"><h3>VOICE FILE</h3><${Code} parts=${r.json} /></div>
            ` : null}
          </div>
        </section>
      </div>
      <div class="status"><span>${r.path}</span><span>${r.count} letters</span><span>${r.seconds}</span><span>${r.mode}</span><span>Mockup: browser audio, not the final Godot sound</span></div>
    </div>`;
  }
}
render(html`<${App} />`, document.body);

</script>
</body>
</html>
